<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gen_Audio | Installation Player (No-Scroll)</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        /* ==========================================
           GEOMETRIA PURA - SINGLE SCREEN UI
           ========================================== */
        
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --faded: #888888;
        }

        /* BLOCCO SCROLL GLOBALE */
        body, html { 
            background: var(--bg); 
            color: var(--fg); 
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; 
            font-size: 12px; 
            letter-spacing: -0.2px;
            margin: 0; 
            padding: 0;
            width: 100vw;
            height: 100dvh; /* Altezza fissa esatta per mobile */
            box-sizing: border-box;
            overflow: hidden; /* NIENTE SCROLL */
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            text-transform: lowercase;
        }

        /* BLOCCO DESKTOP */
        #desktop-block {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: var(--bg);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        body.is-desktop #desktop-block { display: flex; }
        body.is-desktop .app-wrapper { display: none !important; }

        /* GRID/FLEX WRAPPER PRINCIPALE (FULL SCREEN RIGIDO) */
        .app-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 25px 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* ANGOLI (HEADER E FOOTER) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .text-right { text-align: right; align-items: flex-end; }

        /* PULSANTI TESTUALI E LOGICA */
        button.text-btn, button.status-btn, button.nav-btn {
            background: transparent;
            border: none;
            color: var(--faded);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            padding: 0; margin: 0;
            text-transform: lowercase;
            transition: color 0.2s;
        }
        button.text-btn { border-bottom: 1px solid var(--faded); color: var(--fg); padding-bottom: 2px; }
        button.text-btn:hover { border-bottom-color: var(--fg); font-weight: bold; }
        
        button.status-btn.is-active { color: var(--fg); font-weight: bold; }
        button.nav-btn:hover, button.nav-btn:active { color: var(--fg); font-weight: bold; }

        /* VOLUME */
        .vol-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 80px; height: 1px; 
            background: var(--faded); outline: none; margin: 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; 
            width: 2px; height: 12px; 
            background: var(--fg); cursor: pointer;
        }

        /* ZONA CENTRALE: OSCILLOSCOPIO & PLAY BUTTON */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }

        #waveformCanvas {
            width: 100%;
            height: 100px;
            margin-bottom: 40px;
        }

        /* PULSANTE CENTRALE UNICO */
        #btnToggle {
            appearance: none;
            outline: none;
            width: 70px; 
            height: 70px;
            border: 4px solid var(--fg); 
            border-radius: 50%; 
            background: transparent;
            cursor: pointer;
            position: relative;
            display: block;
            transition: transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        #btnToggle:active { transform: scale(0.95); }

        #btnToggle::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 34px; height: 34px;
            background: var(--fg);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #btnToggle.is-playing::after { 
            transform: translate(-50%, -50%) scale(1);
        }

        /* NAVIGATORE DI TRACCIA (SOSTITUISCE LA PLAYLIST) */
        .track-navigator {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 13px;
        }
        
        #currentTrackDisplay {
            color: var(--fg);
            font-weight: bold;
            min-width: 140px; /* Evita salti di layout se i nomi cambiano lunghezza */
            text-align: center;
        }

        .hidden { display: none !important; }

        /* OVERLAY MODALE PER SCANNER QR */
        #qrModal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100dvh;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        
        .camera-viewport {
            width: 80vw; height: 80vw;
            max-width: 300px; max-height: 300px;
            border: 1px solid var(--fg);
            overflow: hidden;
            position: relative;
            background: #fafafa;
        }
        
        #qrReader video {
            width: 100% !important; height: 100% !important;
            object-fit: cover !important;
        }
    </style>
</head>
<body>

    <div id="desktop-block">
        <div class="info-block" style="align-items: center; gap: 15px; text-align: center;">
            <span>system / gen_audio.no_scroll</span>
            <span>[ error: access denied ]</span>
            <span style="color: var(--faded); max-width: 280px; line-height: 1.4;">
                this installation is designed for mobile interactions via camera scan.<br><br>
                please open this url on an ios or android device.
            </span>
        </div>
    </div>

    <div id="qrModal" class="hidden">
        <span style="color: var(--faded);">[ inquadra qr_code ]</span>
        <div class="camera-viewport">
            <div id="qrReader" style="width: 100%; height: 100%;"></div>
        </div>
        <button id="btnCancelScan" class="text-btn">abort_scan</button>
    </div>

    <div class="app-wrapper">
        
        <header>
            <div class="info-block">
                <span style="color: var(--faded);">cartridge</span>
                <button id="btnScanQR" class="text-btn">[ qr_scan ]</button>
            </div>
            
            <div class="info-block text-right">
                <button id="btnAcid" class="status-btn">logic: acid [off]</button>
                <button id="btnAutoBreak" class="status-btn">logic: break [off]</button>
                <div class="vol-container" style="margin-top: 10px;">
                    <span style="color: var(--faded);">vol</span>
                    <input type="range" id="masterVol" min="0" max="1.5" step="0.01" value="0.8">
                </div>
            </div>
        </header>
        
        <main>
            <canvas id="waveformCanvas"></canvas> 
            <button id="btnToggle" aria-label="Play/Stop"></button>
        </main>

        <footer>
            <div class="info-block">
                <span style="color: var(--faded);">tracks_index</span>
                
                <div class="track-navigator">
                    <button id="btnPrev" class="nav-btn">[ < ]</button>
                    <span id="currentTrackDisplay">-- / awaiting data</span>
                    <button id="btnNext" class="nav-btn">[ > ]</button>
                </div>

            </div>
            
            <div class="info-block text-right" style="color: var(--faded);">
                <span>design: pure geometry</span>
                <span>source: optical fetch</span>
            </div>
        </footer>

    </div>

    <script>
        // ==========================================
        // 0. DEVICE DETECTION (MOBILE ONLY STRICT)
        // ==========================================
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (!isMobile) document.body.classList.add('is-desktop');

        // ==========================================
        // 1. LOGICA PLAYER E GESTIONE DATI
        // ==========================================
        let albumData = {};       
        let tracklist = [];       
        let currentTrackIndex = 0;
        let isPlaying = false;
        
        let acidMode = false;
        let autoBreakMode = false;
        let liveBreakActive = false;
        let liveBreakType = 0;
        let liveBreakStepsRemaining = 0;
        
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let ctx = null;
        let masterCompressor, masterGain, globalReverbNode, noiseBuffer, tapeGateGain;
        let analyser, dataArray, bufferLength; 
        
        const OSC_TYPES = ['sine', 'square', 'sawtooth', 'triangle']; 
        const FLT_TYPES = ['lowpass', 'highpass', 'bandpass'];

        let globalLoopBuffer = null;
        let bpm = 120;
        let nextNoteTime = 0;
        let currentStep = 0;
        let timerID = null;
        const numSteps = 64; 
        let modules = {};

        const modulesConfig = [
            { id: 'trk1', name: 'KICK', muted: false, p: { osc: 0, frq: 55, swp: 300, nz: 0.0, fTp: 0, fCt: 1000, fQ: 1, fmF: 0, fmI: 0, dec: 0.3 }, fx: { dly: 0.0, fb: 0, dColor: 1.0, dWet: 0, rev: 0.05 } },
            { id: 'trk2', name: 'SNARE', muted: false, p: { osc: 3, frq: 250, swp: 0, nz: 0.8, fTp: 2, fCt: 2000, fQ: 1, fmF: 0, fmI: 0, dec: 0.15 }, fx: { dly: 0.1, fb: 0.2, dColor: 1.0, dWet: 0.2, rev: 0.2 } },
            { id: 'trk3', name: 'HATS', muted: false, p: { osc: 1, frq: 5000, swp: 0, nz: 1.0, fTp: 1, fCt: 6000, fQ: 2, fmF: 0, fmI: 0, dec: 0.03 }, fx: { dly: 0.1, fb: 0.1, dColor: 1.0, dWet: 0.1, rev: 0.05 } },
            { id: 'trk4', name: 'GLITCH', muted: false, p: { osc: 1, frq: 100, swp: 0, nz: 0.1, fTp: 0, fCt: 4000, fQ: 0, fmF: 350, fmI: 1000, dec: 0.05 }, fx: { dly: 0.17, fb: 0.4, dColor: 1.0, dWet: 0.3, rev: 0.2 } },
            { id: 'trk5', name: 'BASS', muted: false, p: { osc: 2, frq: 40, swp: 0, nz: 0.0, fTp: 0, fCt: 600, fQ: 5, fmF: 0, fmI: 0, dec: 0.4 }, fx: { dly: 0.0, fb: 0.0, dColor: 1.0, dWet: 0, rev: 0.0 } },
            { id: 'trk6', name: 'SAMPLE', muted: false, isSampler: true, p: { vol: 1.5, frq: 100, osc: 0, swp: 0, nz: 0, fTp: 0, fCt: 20000, fQ: 1, fmF: 0, fmI: 0, dec: 1.0 }, fx: { dly: 0.15, fb: 0.3, dColor: 1.0, dWet: 0.3, rev: 0.2 } },
            { id: 'trk7', name: 'EXT 1', muted: false, p: { osc: 0, frq: 200, swp: 0, nz: 0.0, fTp: 0, fCt: 2000, fQ: 1, fmF: 0, fmI: 0, dec: 0.2 }, fx: { dly: 0.0, fb: 0, dColor: 1.0, dWet: 0, rev: 0.0 } },
            { id: 'trk8', name: 'EXT 2', muted: false, p: { osc: 1, frq: 400, swp: 0, nz: 0.0, fTp: 0, fCt: 2000, fQ: 1, fmF: 0, fmI: 0, dec: 0.2 }, fx: { dly: 0.0, fb: 0, dColor: 1.0, dWet: 0, rev: 0.0 } },
            { id: 'trk9', name: 'SMP 1', muted: false, isSampler: true, p: { vol: 1.5, frq: 100, osc: 0, swp: 0, nz: 0, fTp: 0, fCt: 20000, fQ: 1, fmF: 0, fmI: 0, dec: 1.0 }, fx: { dly: 0.0, fb: 0.0, dColor: 1.0, dWet: 0, rev: 0.0 } },
            { id: 'trk10', name: 'SMP 2', muted: false, isSampler: true, p: { vol: 1.5, frq: 100, osc: 0, swp: 0, nz: 0, fTp: 0, fCt: 20000, fQ: 1, fmF: 0, fmI: 0, dec: 1.0 }, fx: { dly: 0.0, fb: 0.0, dColor: 1.0, dWet: 0, rev: 0.0 } },
            { id: 'tape', name: 'TAPE LOOP', muted: false, isTape: true, p: { vol: 1.0, dec: 0.05 }, fx: { fTp: 0, fCt: 20000, fQ: 0, dly: 0.0, fb: 0.0, dColor: 1.0, dWet: 0, rev: 0.0 } }
        ];

        function initModulesStructure() {
            modules = {};
            modulesConfig.forEach(cfg => { 
                modules[cfg.id] = { ...cfg, pattern: Array(numSteps).fill(0), patternLen: Array(numSteps).fill(1.0), audioNodes: null, sampleBuffer: null }; 
            });
        }

        const currentTrackDisplay = document.getElementById('currentTrackDisplay');

        function updateTrackDisplay() {
            if(tracklist.length === 0) {
                currentTrackDisplay.innerText = "-- / awaiting data";
                return;
            }
            const trackNum = String(currentTrackIndex + 1).padStart(2, '0');
            currentTrackDisplay.innerText = `${trackNum} / ${tracklist[currentTrackIndex]}`;
        }

        function processAndLoadDatabase(rawData) {
            albumData = {}; tracklist = [];
            Object.keys(rawData).forEach(key => {
                const p = rawData[key];
                if (p && p.state && Array.isArray(p.state) && p.state.length > 0 && p.bpm) {
                    albumData[key] = p; tracklist.push(key);
                }
            });

            if(tracklist.length === 0) { 
                currentTrackDisplay.innerText = "err: invalid structure";
                return; 
            }

            currentTrackIndex = 0;
            initModulesStructure();
            updateTrackDisplay();
            loadTrackIntoEngine(currentTrackIndex); 
        }

        // ==========================================
        // 2. ACQUISIZIONE QR
        // ==========================================
        const btnScanQR = document.getElementById('btnScanQR');
        const qrModal = document.getElementById('qrModal');
        const btnCancelScan = document.getElementById('btnCancelScan');
        
        let html5QrCode = null;

        btnScanQR.addEventListener('click', () => {
            if (!isMobile) return; 
            qrModal.classList.remove('hidden');
            if(!html5QrCode) html5QrCode = new Html5Qrcode("qrReader");
            
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                (qrCodeMessage) => {
                    qrModal.classList.add('hidden');
                    html5QrCode.stop();
                    currentTrackDisplay.innerText = "fetching remote...";
                    
                    fetch(qrCodeMessage)
                        .then(res => { if(!res.ok) throw new Error(); return res.json(); })
                        .then(data => { processAndLoadDatabase(data); })
                        .catch(() => { currentTrackDisplay.innerText = "err: fetch failed"; });
                },
                () => {}
            ).catch(() => {
                currentTrackDisplay.innerText = "err: camera denied";
                qrModal.classList.add('hidden');
            });
        });

        btnCancelScan.addEventListener('click', () => {
            qrModal.classList.add('hidden');
            if(html5QrCode) html5QrCode.stop();
        });

        // ==========================================
        // 3. CONTROLLI INTERFACCIA
        // ==========================================
        const btnToggle = document.getElementById('btnToggle');

        document.getElementById('btnNext').addEventListener('click', () => {
            if (tracklist.length === 0) return;
            currentTrackIndex = (currentTrackIndex + 1) % tracklist.length; 
            updateTrackDisplay(); loadTrackIntoEngine(currentTrackIndex);
            if (isPlaying) { stopAudioEngine(); startAudioEngine(); }
        });

        document.getElementById('btnPrev').addEventListener('click', () => {
            if (tracklist.length === 0) return;
            currentTrackIndex = (currentTrackIndex - 1 + tracklist.length) % tracklist.length;
            updateTrackDisplay(); loadTrackIntoEngine(currentTrackIndex);
            if (isPlaying) { stopAudioEngine(); startAudioEngine(); }
        });

        btnToggle.addEventListener('click', function() {
            if (tracklist.length === 0) return;
            if (!isPlaying) {
                isPlaying = true; this.classList.add('is-playing'); startAudioEngine(); 
            } else {
                isPlaying = false; this.classList.remove('is-playing'); stopAudioEngine(); liveBreakActive = false; 
            }
        });

        document.getElementById('btnAcid').addEventListener('click', function() {
            acidMode = !acidMode; this.innerText = acidMode ? 'logic: acid [on]' : 'logic: acid [off]'; this.classList.toggle('is-active', acidMode);
        });

        document.getElementById('btnAutoBreak').addEventListener('click', function() {
            autoBreakMode = !autoBreakMode; this.innerText = autoBreakMode ? 'logic: break [on]' : 'logic: break [off]'; this.classList.toggle('is-active', autoBreakMode);
        });

        document.getElementById('masterVol').addEventListener('input', (e) => {
            const volume = parseFloat(e.target.value);
            if (masterGain && ctx) masterGain.gain.setTargetAtTime(volume, ctx.currentTime, 0.1);
        });

        function loadTrackIntoEngine(index) {
            const trackName = tracklist[index]; const trackData = albumData[trackName]; if(!trackData) return;
            bpm = trackData.bpm; Object.values(modules).forEach(m => m.pattern.fill(0));
            trackData.state.forEach(savedM => {
                if (modules[savedM.id]) {
                    modules[savedM.id].pattern = savedM.pattern.map(v => v === null || v === false ? 0 : (v === true ? 1 : v));
                    if (savedM.patternLen) modules[savedM.id].patternLen = savedM.patternLen;
                    modules[savedM.id].muted = savedM.muted || false;
                    for (let key in savedM.p) modules[savedM.id].p[key] = savedM.p[key];
                    if (savedM.fx) { for (let key in savedM.fx) modules[savedM.id].fx[key] = savedM.fx[key]; }
                }
            });
        }

        function initVisualizer() {
            const canvas = document.getElementById('waveformCanvas'); const canvasCtx = canvas.getContext('2d');
            const updateCanvasSize = () => {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = canvas.offsetWidth * dpr; canvas.height = canvas.offsetHeight * dpr;
                canvasCtx.scale(dpr, dpr);
            };
            window.addEventListener('resize', updateCanvasSize); updateCanvasSize();

            function draw() {
                requestAnimationFrame(draw); canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                canvasCtx.lineWidth = 1; canvasCtx.strokeStyle = '#000000'; canvasCtx.imageSmoothingEnabled = false; canvasCtx.beginPath();
                const centerY = Math.floor(canvas.offsetHeight / 2) + 0.5;
                if (!isPlaying || !analyser) {
                    canvasCtx.moveTo(0, centerY); canvasCtx.lineTo(canvas.offsetWidth, centerY); canvasCtx.stroke(); return;
                }
                analyser.getByteTimeDomainData(dataArray); const sliceWidth = canvas.offsetWidth / bufferLength; let x = 0;
                for(let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0; const y = Math.floor(v * canvas.offsetHeight / 2) + 0.5;
                    if(i === 0) { canvasCtx.moveTo(x, y); } else { canvasCtx.lineTo(x, y); } x += sliceWidth;
                }
                canvasCtx.lineTo(canvas.offsetWidth, centerY); canvasCtx.stroke();
            }
            draw(); 
        }

        // ==========================================
        // 4. AUDIO ENGINE
        // ==========================================
        function initAudioEngine() {
            if (ctx) return; ctx = new AudioContext();
            masterCompressor = ctx.createDynamicsCompressor(); masterCompressor.threshold.value = -3.0; masterCompressor.knee.value = 12.0; masterCompressor.ratio.value = 15.0; masterCompressor.attack.value = 0.002; masterCompressor.release.value = 0.1;
            analyser = ctx.createAnalyser(); analyser.fftSize = 2048; bufferLength = analyser.frequencyBinCount; dataArray = new Uint8Array(bufferLength);
            masterGain = ctx.createGain(); masterGain.gain.value = parseFloat(document.getElementById('masterVol').value) || 0.8; 
            masterGain.connect(masterCompressor); masterCompressor.connect(analyser); analyser.connect(ctx.destination);
            initVisualizer(); 
            const length = ctx.sampleRate * 1.5; const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
            for (let i = 0; i < 2; i++) { const channel = impulse.getChannelData(i); for (let j = 0; j < length; j++) channel[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / length, 3.0); }
            globalReverbNode = ctx.createConvolver(); globalReverbNode.buffer = impulse; globalReverbNode.connect(masterCompressor); 
            noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const output = noiseBuffer.getChannelData(0); for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
            tapeGateGain = ctx.createGain();

            Object.values(modules).forEach(m => {
                const input = ctx.createGain(); const delay = ctx.createDelay(2.0); const feedback = ctx.createGain(); const delayWet = ctx.createGain(); const dry = ctx.createGain(); const reverbSend = ctx.createGain(); const dubFilter = ctx.createBiquadFilter(); dubFilter.type = 'lowpass'; const trackFilter = ctx.createBiquadFilter();
                const tapeSaturation = ctx.createWaveShaper(); const curve = new Float32Array(8192); for (let i = 0; i < 8192; ++i) { const x = (i * 2) / 8192 - 1; curve[i] = Math.tanh(x); } tapeSaturation.curve = curve;
                let signalRoot = input; if (m.isTape) { input.connect(trackFilter); signalRoot = trackFilter; }
                signalRoot.connect(dry); signalRoot.connect(delay); signalRoot.connect(reverbSend);
                delay.connect(dubFilter); dubFilter.connect(tapeSaturation); tapeSaturation.curve = curve; tapeSaturation.connect(feedback); feedback.connect(delay); delay.connect(delayWet); 
                dry.connect(masterGain); delayWet.connect(masterGain); reverbSend.connect(globalReverbNode);
                m.audioNodes = { trackFilter, delay, feedback, dubFilter, delayWet, dry, reverbSend, input };
                updateFXRouting(m.id); if (m.isTape) tapeGateGain.connect(m.audioNodes.input); 
            });
        }

        function updateFXRouting(id, time = ctx ? ctx.currentTime : 0) {
            const m = modules[id]; if (!m.audioNodes) return;
            m.audioNodes.delay.delayTime.setValueAtTime(m.fx.dly, time); m.audioNodes.feedback.gain.setValueAtTime(m.fx.fb, time);
            const filterCutoff = 300 + Math.pow(m.fx.dColor || 1.0, 2) * 19700; m.audioNodes.dubFilter.frequency.setValueAtTime(filterCutoff, time);
            m.audioNodes.delayWet.gain.setValueAtTime(m.fx.dWet, time); m.audioNodes.dry.gain.setValueAtTime(1.0, time); m.audioNodes.reverbSend.gain.setValueAtTime(m.fx.rev, time);
        }

        function playUniversalVoice(t, p, dest, vel = 1.0, lenMulti = 1.0) {
            if(!ctx) return; const actualDecay = Math.max(0.01, p.dec * lenMulti); const osc = ctx.createOscillator(); const oscGain = ctx.createGain(); osc.type = OSC_TYPES[Math.floor(p.osc) % 4] || 'sine'; osc.frequency.setValueAtTime(Math.max(1, p.frq + (p.swp || 0)), t);
            if (p.swp > 0) osc.frequency.exponentialRampToValueAtTime(Math.max(1, p.frq), t + (actualDecay * 0.5)); else osc.frequency.setValueAtTime(Math.max(1, p.frq), t);
            if (p.fmI > 0) { const mod = ctx.createOscillator(); const modGain = ctx.createGain(); mod.type = 'sawtooth'; mod.frequency.setValueAtTime(p.fmF, t); modGain.gain.setValueAtTime(0, t); modGain.gain.linearRampToValueAtTime(p.fmI * (0.5 + 0.5 * vel), t + 0.005); modGain.gain.linearRampToValueAtTime(0, t + actualDecay); mod.connect(modGain); modGain.connect(osc.frequency); mod.start(t); mod.stop(t + actualDecay + 0.1); }
            const filter = ctx.createBiquadFilter(); filter.type = FLT_TYPES[Math.floor(p.fTp) % 3] || 'lowpass'; filter.frequency.setValueAtTime(Math.max(10, p.fCt * (0.3 + 0.7 * vel)), t); filter.Q.value = p.fQ;
            if (p.nz > 0) { const noise = ctx.createBufferSource(); const noiseGain = ctx.createGain(); noise.buffer = noiseBuffer; noiseGain.gain.setValueAtTime(p.nz, t); noise.connect(noiseGain); noiseGain.connect(filter); noise.start(t); noise.stop(t + actualDecay + 0.1); }
            const ampEnv = ctx.createGain(); ampEnv.gain.setValueAtTime(0.001, t); ampEnv.gain.linearRampToValueAtTime(1.0 * vel, t + 0.002); ampEnv.gain.exponentialRampToValueAtTime(0.001, t + actualDecay);
            oscGain.gain.setValueAtTime(1.0 - (p.nz * 0.5), t); osc.connect(oscGain); oscGain.connect(filter); filter.connect(ampEnv); ampEnv.connect(dest); osc.start(t); osc.stop(t + actualDecay + 0.1); 
        }

        function playSampleVoice(t, p, dest, buffer, vel = 1.0, lenMulti = 1.0) {
            if (!buffer || !ctx) return; const actualDecay = Math.max(0.01, p.dec * lenMulti); const source = ctx.createBufferSource(); source.buffer = buffer; source.playbackRate.value = Math.max(0.1, p.frq / 100);
            const filter = ctx.createBiquadFilter(); filter.type = FLT_TYPES[Math.floor(p.fTp) % 3] || 'lowpass'; filter.frequency.setValueAtTime(Math.max(10, p.fCt * (0.7 + 0.3 * vel)), t); filter.Q.value = p.fQ;
            const baseVol = p.vol !== undefined ? p.vol : 1.0; const ampEnv = ctx.createGain(); ampEnv.gain.setValueAtTime(0.001, t); ampEnv.gain.linearRampToValueAtTime(baseVol * vel, t + 0.002); ampEnv.gain.exponentialRampToValueAtTime(0.001, t + actualDecay); 
            source.connect(filter); filter.connect(ampEnv); ampEnv.connect(dest); source.start(t); source.stop(t + actualDecay + 0.1);
        }

        function startAudioEngine() { if (!ctx) initAudioEngine(); if (ctx.state === 'suspended') ctx.resume(); currentStep = 0; nextNoteTime = ctx.currentTime + 0.1; scheduler(); }
        function stopAudioEngine() { clearTimeout(timerID); }

        function scheduler() {
            while (nextNoteTime < ctx.currentTime + 0.1) {
                const stepToPlay = currentStep; const timeToPlay = nextNoteTime;
                if (autoBreakMode && !liveBreakActive) {
                    const posInBar = stepToPlay % 16; const isMacroPage = (stepToPlay === 48); 
                    if (isMacroPage && Math.random() < 0.4) { liveBreakStepsRemaining = 16; liveBreakActive = true; liveBreakType = 1; } 
                    else if ((posInBar === 12 || posInBar === 14) && Math.random() < 0.25) { liveBreakStepsRemaining = 16 - posInBar; liveBreakActive = true; liveBreakType = Math.floor(Math.random() * 3); }
                }
                Object.values(modules).forEach(m => {
                    let velocity = m.pattern[stepToPlay]; const length = m.patternLen[stepToPlay] || 1; 
                    if (autoBreakMode && liveBreakActive) {
                        if (liveBreakType === 0 && !m.isTape) velocity = 0; 
                        else if (liveBreakType === 1 && (m.name.includes('KICK') || m.name.includes('BASS'))) velocity = 0; 
                        else if (liveBreakType === 2 && stepToPlay % 2 !== 0) velocity = 0; 
                    }
                    let activeP = { ...m.p }; let activeFX = { ...m.fx };
                    if (acidMode && velocity > 0) {
                        activeP.fCt = Math.max(100, Math.min(20000, activeP.fCt * ((Math.random() * 1.5) + 0.5))); activeP.dec = Math.max(0.01, Math.min(3.0, activeP.dec * ((Math.random() * 0.8) + 0.6)));
                        if (activeFX.dWet !== undefined) activeFX.dWet = Math.min(1.0, activeFX.dWet * ((Math.random() * 0.4) + 0.8));
                        if (activeFX.fb !== undefined) activeFX.fb = Math.min(0.9, activeFX.fb * ((Math.random() * 0.4) + 0.8));
                        if (activeFX.rev !== undefined) activeFX.rev = Math.min(1.0, activeFX.rev * ((Math.random() * 0.4) + 0.8));
                    }
                    const tempP = m.p; const tempFX = m.fx; m.p = activeP; m.fx = activeFX; updateFXRouting(m.id, timeToPlay); m.p = tempP; m.fx = tempFX;
                    if(!m.isTape) { if (velocity > 0 && !m.muted) { if (m.isSampler) playSampleVoice(timeToPlay, activeP, m.audioNodes.input, m.sampleBuffer, velocity, length); else playUniversalVoice(timeToPlay, activeP, m.audioNodes.input, velocity, length); } } 
                    else {
                        if(m.audioNodes && m.audioNodes.trackFilter) { m.audioNodes.trackFilter.type = FLT_TYPES[Math.floor(activeFX.fTp) % 3] || 'lowpass'; m.audioNodes.trackFilter.frequency.setTargetAtTime(Math.max(10, activeFX.fCt), timeToPlay, 0.01); if(activeFX.fQ !== undefined) m.audioNodes.trackFilter.Q.setTargetAtTime(activeFX.fQ, timeToPlay, 0.01); }
                        if (globalLoopBuffer && stepToPlay % 64 === 0) { const src = ctx.createBufferSource(); src.buffer = globalLoopBuffer; src.playbackRate.value = globalLoopBuffer.duration / (16 * (60.0 / bpm)); src.connect(tapeGateGain); src.start(timeToPlay); }
                        const tapeDecay = Math.max(0.01, activeP.dec); if (velocity > 0 && !m.muted) tapeGateGain.gain.setTargetAtTime(activeP.vol, timeToPlay, 0.002); else tapeGateGain.gain.setTargetAtTime(0.0001, timeToPlay, tapeDecay / 3); 
                    }
                });
                if (autoBreakMode && liveBreakActive) { liveBreakStepsRemaining--; if (liveBreakStepsRemaining <= 0) liveBreakActive = false; }
                nextNoteTime += 0.25 * (60.0 / bpm); currentStep = (currentStep + 1) % numSteps;
            }
            timerID = setTimeout(scheduler, 25.0);
        }
    </script>
